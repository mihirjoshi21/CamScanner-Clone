name: Build CamScanner APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # sdkmanager کو چلانے کے لیے Java 17 لازمی ہے
      - name: Setup Java 17 for sdkmanager
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        env:
          SKIP_JDK_VERSION_CHECK: true
        run: |
          sdkmanager --install "platforms;android-23" "build-tools;23.0.2"

      # APK بلڈ کے لیے Java 8 پر واپس سوئچ کریں
      - name: Switch to Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CamScanner-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
