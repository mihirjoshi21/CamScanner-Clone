name: Build CamScanner APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 1. aapt کی 32-bit لائبریریوں کی تنصیب
      - name: Install 32-bit libraries for aapt
        run: |
          sudo apt-get update
          sudo apt-get install -y lib32z1 lib32stdc++6

      # 2. sdkmanager کے لیے Java 17
      - name: Setup Java 17 for sdkmanager
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. build-tools کا نیا ورژن (23.0.2 کے بجائے 25.0.0 یا اس سے نیا)
      - name: Install Android SDK packages
        env:
          SKIP_JDK_VERSION_CHECK: true
        run: |
          sdkmanager --install "platforms;android-23" "build-tools;25.0.0"

      # 4. APK بلڈ کے لیے Java 8
      - name: Switch to Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build APK
        env:
          SLAVE_AAPT_TIMEOUT: 30
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace
