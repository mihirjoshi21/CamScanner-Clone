name: Build CamScanner APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # یہ نیا سٹیپ شامل کیا گیا ہے تاکہ sdkmanager کام کر سکے
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # یہاں سے پرانا لائسنس والا سٹیپ ہٹا دیا گیا ہے
      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-23" "build-tools;23.0.2"

      - name: Switch to Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CamScanner-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
